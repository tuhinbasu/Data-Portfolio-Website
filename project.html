<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>Project — Tuhin Basu</title>
<link rel="icon" href="data:image/svg+xml,<svg xmlns=%22http://www.w3.org/2000/svg%22 viewBox=%220 0 100 100%22><text y=%22.9em%22 font-size=%2290%22>📊</text></svg>">
<link rel="stylesheet" href="css/style.css">
</head>
<body>

<header class="site-header">
  <div class="wrap">
    <a class="brand" href="index.html">Tuhin Basu</a>
    <button class="nav-toggle" aria-label="Toggle navigation" aria-expanded="false">
      <span></span><span></span>
    </button>
    <nav class="primary-nav">
      <ul>
        <li><a href="index.html">Home</a></li>
        <li><a href="projects.html" aria-current="page">Projects</a></li>
        <li><a href="about.html">About</a></li>
        <li><a href="contact.html">Contact</a></li>
      </ul>
    </nav>
  </div>
</header>

<article class="detail-hero">
  <div class="wrap" id="detail-root">
    <p>Loading project…</p>
  </div>
</article>

<footer class="site-footer">
  <div class="wrap">
    <div>
      <p class="foot-name">Tuhin Basu</p>
      <p class="foot-role">Data Analyst | Business Analyst</p>
    </div>
    <div class="foot-links">
      <a href="https://linkedin.com/in/placeholder">LinkedIn</a>
      <a href="https://github.com/placeholder">GitHub</a>
      <a href="mailto:hello@example.com">Email</a>
    </div>
  </div>
  <div class="foot-bottom">
    <div class="wrap"><p>© 2026 Tuhin Basu. All rights reserved.</p></div>
  </div>
</footer>

<script src="js/data.js"></script>
<script>
  var params = new URLSearchParams(window.location.search)
  var slug = params.get('slug')
  var index = PROJECTS.findIndex(function (p) { return p.slug === slug })
  var root = document.getElementById('detail-root')

  if (index === -1) {
    root.innerHTML =
      '<p>Project not found.</p><a class="text-link" href="projects.html">Back to Projects</a>'
  } else {
    var project = PROJECTS[index]
    var prev = PROJECTS[(index - 1 + PROJECTS.length) % PROJECTS.length]
    var next = PROJECTS[(index + 1) % PROJECTS.length]
    var stages = ['Data', 'Cleaning', 'Analysis', 'Visualization', 'Insight']

    document.title = project.title + ' — Tuhin Basu'

    root.innerHTML =
      '<a class="text-link" href="projects.html" style="display:inline-block; margin-bottom:28px;">Back to Projects</a>' +
      '<p class="detail-tools">' + project.tools.join(', ') + '</p>' +
      '<h1 style="max-width:640px;">' + project.title + '</h1>' +
      '<div class="detail-cover"><img src="' + project.image + '" alt="' + project.title + ' dashboard"></div>' +
      '<div class="detail-grid">' +
        '<div>' +
          '<div class="detail-section"><h2>Overview</h2><p>' + project.overview + '</p></div>' +
          '<div class="detail-section"><h2>Objective</h2><p>' + project.objective + '</p></div>' +
          '<div class="detail-section"><h2>Dataset</h2><p>' + project.dataset + '</p></div>' +
          '<div class="detail-section"><h2>Key Insights</h2><ul class="insight-list">' +
            project.insights.map(function (i) { return '<li>' + i + '</li>' }).join('') +
          '</ul></div>' +
          '<div class="detail-section"><h2>Business Impact</h2><p>' + project.impact + '</p></div>' +
          '<div class="detail-section"><h2>What I Learned</h2><p>' + project.learned + '</p></div>' +
        '</div>' +
        '<aside class="detail-aside">' +
          '<h3>Process</h3>' +
          '<ol class="mini-process">' +
            stages.map(function (s, i) {
              return '<li><span class="num tabular">' + String(i + 1).padStart(2, '0') + '</span><span>' + s + '</span></li>'
            }).join('') +
          '</ol>' +
          '<h3>Tools</h3>' +
          '<p style="font-size:0.9rem; color:var(--ink); margin:0;">' + project.tools.join(', ') + '</p>' +
        '</aside>' +
      '</div>' +
      '<div class="detail-nav">' +
        '<a href="project.html?slug=' + prev.slug + '">Previous Project</a>' +
        '<a class="all" href="projects.html">All Projects</a>' +
        '<a href="project.html?slug=' + next.slug + '">Next Project</a>' +
      '</div>'
  }
</script>
<script src="js/main.js"></script>
</body>
</html>
